<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="512" height="512" rx="104" ry="104"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="512" height="512" fill="#23324d"/>

    <!-- envelope body -->
    <rect x="96" y="196" width="320" height="220" rx="10" fill="#f7f2e7"/>

    <!-- envelope flap -->
    <polygon points="96,196 416,196 256,338" fill="#e8dcc8"/>

    <!-- flap crease lines -->
    <line x1="96" y1="196" x2="256" y2="338" stroke="#23324d" stroke-width="4" stroke-opacity="0.12"/>
    <line x1="416" y1="196" x2="256" y2="338" stroke="#23324d" stroke-width="4" stroke-opacity="0.12"/>

    <!-- wax seal -->
    <circle cx="256" cy="300" r="34" fill="#a63e26"/>
    <circle cx="256" cy="300" r="34" fill="none" stroke="#f7f2e7" stroke-width="3" stroke-opacity="0.35"/>
    <path d="M241 302 L251 312 L273 288" stroke="#f7f2e7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- gold corner accent -->
    <rect x="0" y="0" width="512" height="14" fill="#b8923d"/>
  </g>
</svg>
